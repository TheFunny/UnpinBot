[package]
name = "unpinbot"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Telegram bot to automatically unpin channel posts forwarded into connected discussion groups"
license = "MIT"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = [
    "rustls",
    "throttle",
    "macros",
    "ctrlc_handler",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
pretty_env_logger = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
