[package]
name = "unpinbot"
version = "1.2.0"
edition = "2021"
description = "Telegram bot to automatically unpin channel posts forwarded into connected discussion groups"
license = "MIT"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = [
    "rustls",
    "throttle",
    "macros",
    "ctrlc_handler",
] }
# Only the features this crate's own code uses: `signal`/`time`/`rt-multi-thread`.
# Relying on teloxide pulling them in transitively makes a dependency bump a
# surprise build failure.
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
pretty_env_logger = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
