services:
  unpin:
    image: yoursfunny/unpinbot:latest
    restart: always
    environment:
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN}
      # UNPINBOT_STATE_PATH: pers_data/state.json
      # RUST_LOG: info
      LOCAL_USER_ID: '1000'
    volumes:
      - ./pers_data:/app/pers_data
    container_name: unpin
    # `restart: always` plus json-file logging fills the host disk over months;
    # cap it here so a long-lived deployment needs no host-side logrotate.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
